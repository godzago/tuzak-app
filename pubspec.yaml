name: tuzak
description: Cihaz üzerinde çalışan mesaj risk kontrolü.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  punycoder: 0.3.0
  google_fonts: 8.2.1
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/clay/
    - assets/ımage/
    - assets/fonts/poppins/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
